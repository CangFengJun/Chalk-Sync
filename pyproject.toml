[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chalksync"
version = "0.1.0"
description = "Local-first video course ingestion and two-stage note generation"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
chalksync = "chalksync.cli:main"

[tool.setuptools.packages.find]
include = ["chalksync*"]
